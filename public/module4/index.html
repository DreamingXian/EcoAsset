<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoAsset - Incident & Analytics Reports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../admin/admin.css?v=1.3">
</head>
<body>

  <!-- Unified Desktop Admin Layout -->
  <div class="admin-desktop-layout">

    <!-- Reusable Admin Sidebar Container -->
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <!-- Main Content Area -->
    <main class="admin-main" style="justify-content: center; align-items: center;">
      <div style="background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 24px; padding: 48px 36px; max-width: 640px; width: 100%; text-align: center; box-shadow: var(--shadow-sm);">
        <span style="font-size: 48px; display: block; margin-bottom: 16px;">📊</span>
        <h2 style="font-family: var(--font-heading); font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 8px;">
          Incident & Analytics Reporting Module
        </h2>
        <p style="font-size: 13.5px; color: #64748b; margin-bottom: 24px; line-height: 1.5;">
          This module (Module 4) is assigned to teammate scope (Geospatial damage heatmaps, Category analytics, Upvote distributions, SLA resolution metrics).
        </p>
        <a href="../module3/admin/index.html" class="btn-action btn-primary" style="text-decoration: none; display: inline-flex; padding: 12px 24px;">
          <span>🛠️ Go to Task Control Dashboard (Module 3)</span>
        </a>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../js/auth-guard.js?v=4.2"></script>
  <script src="../js/admin-sidebar.js?v=1.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await AuthGuard.requireAuth(['ADMINISTRATOR']);
      if (!user) return;
      initAdminSidebar('reports');
    });
  </script>
</body>
</html>
