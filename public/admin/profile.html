<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoAsset - Administrator Profile</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">

  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="admin.css?v=1.3">
</head>

<body>

  <!-- Toast Notification Banner -->
  <div class="toast-banner" id="toastBanner">
    <span id="toastMsg">Action executed successfully.</span>
    <span style="cursor: pointer;" onclick="document.getElementById('toastBanner').classList.remove('show')">✕</span>
  </div>

  <!-- Unified Desktop Admin Layout -->
  <div class="admin-desktop-layout">

    <!-- Reusable Admin Sidebar Container -->
    <aside class="admin-sidebar" id="adminSidebar"></aside>

    <!-- Main Content Area -->
    <main class="admin-main" style="align-items: center; justify-content: center; padding-top: 40px; padding-bottom: 60px;">

      <div class="profile-card-container">

        <div class="profile-top-avatar" id="profileAvatar">AD</div>

        <h1 class="profile-name" id="profileFullName">Administrator</h1>
        <p class="profile-email" id="profileEmail">admin@ecoasset.org</p>

        <div style="text-align: center; margin-bottom: 24px;">
          <span class="profile-role-pill">
            <span>🏛️ MUNICIPAL ADMINISTRATOR</span>
          </span>
        </div>

        <div class="profile-info-grid">
          <div class="profile-info-row">
            <span class="profile-info-lbl">Account Role</span>
            <span class="profile-info-val" style="color: #059669; font-weight: 700;">System Administrator</span>
          </div>
          <div class="profile-info-row">
            <span class="profile-info-lbl">Email Address</span>
            <span class="profile-info-val" id="profileInfoEmail">admin@ecoasset.org</span>
          </div>
          <div class="profile-info-row">
            <span class="profile-info-lbl">Account Status</span>
            <span class="profile-info-val" id="profileAccountStatus" style="color: #059669; font-weight: 700;">● Active</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px;">
          <a href="../module5/update-account.html" class="btn-action btn-primary"
            style="width: 100%; text-decoration: none; padding: 12px; font-size: 13.5px; text-align: center;">
            <span>⚙️ Update Account Details</span>
          </a>

          <button class="btn-profile-logout" onclick="handleLogout()">
            <span>🚪 Sign Out / Switch Account</span>
          </button>
        </div>

      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="../js/auth-guard.js?v=4.2"></script>
  <script src="../js/admin-sidebar.js?v=1.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Enforce Admin Authorization
      const user = await AuthGuard.requireAuth(['ADMINISTRATOR']);
      if (!user) return;

      // 2. Initialize Shared Admin Sidebar
      initAdminSidebar('account');

      // 3. Populate Profile Fields
      const name = user.full_name || 'Municipal Administrator';
      const email = user.email || 'admin@ecoasset.org';
      const isActive = user.is_active !== false && user.is_active !== 0 && user.is_active !== '0';

      document.getElementById('profileFullName').textContent = name;
      document.getElementById('profileEmail').textContent = email;
      document.getElementById('profileInfoEmail').textContent = email;

      const statusEl = document.getElementById('profileAccountStatus');
      if (statusEl) {
        if (isActive) {
          statusEl.textContent = '● Active';
          statusEl.style.color = '#059669';
        } else {
          statusEl.textContent = '● Inactive';
          statusEl.style.color = '#ef4444';
        }
      }

      const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'AD';
      document.getElementById('profileAvatar').textContent = initials;
    });
  </script>
</body>

</html>
